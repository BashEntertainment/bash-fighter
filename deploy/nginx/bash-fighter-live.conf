# Managed by John (Bash Entertainment). App locations live in
# /etc/nginx/snippets/bash-fighter-app.conf so every server block below
# serves exactly the same game.

upstream bash_fighter_app {
    server 127.0.0.1:8081;
    keepalive 32;
}

# Canonical HTTPS host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bashfighter.com www.bashfighter.com;
    include /etc/nginx/snippets/bash-fighter-app.conf;
    ssl_certificate /etc/letsencrypt/live/bashfighter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bashfighter.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Bare-IP HTTPS (cert will not match the IP; kept so nothing 404s).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    include /etc/nginx/snippets/bash-fighter-app.conf;
    ssl_certificate /etc/letsencrypt/live/bashfighter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bashfighter.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Named hosts on port 80 redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name bashfighter.com www.bashfighter.com;
    # HTTPS redirect temporarily disabled 2026-09-12: inbound TCP 443 from
    # the public internet is unreachable (Cloudflare edge returns 522 while
    # the origin serves 443 correctly on-box), so redirecting would take the
    # domain offline. Re-enable the return 301 once 443 is reachable.
    include /etc/nginx/snippets/bash-fighter-app.conf;
}

# Bare IP and anything else on port 80 keeps serving the game directly,
# so http://135.181.45.254/ never breaks.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/bash-fighter-app.conf;
}
