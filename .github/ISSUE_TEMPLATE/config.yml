blank_issues_enabled: true
contact_links:
  - name: Playtest feedback, feature ideas, or a question
    url: https://github.com/BashEntertainment/bash-fighter/issues/new?labels=question&title=%5BQuestion%5D%20
    about: >-
      Not a concrete bug or a scoped feature request? GitHub Discussions is
      not enabled on this repo yet, so open a blank/question issue instead —
      it will be triaged manually.
  - name: Report a security vulnerability
    url: https://github.com/BashEntertainment/bash-fighter/security/advisories/new
    about: Please do not report security vulnerabilities as a public issue. Use private vulnerability reporting instead (see SECURITY.md).
