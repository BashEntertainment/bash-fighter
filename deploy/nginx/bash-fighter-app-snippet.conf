    root /srv/bash-fighter/static;
    index index.html;

    # Static client build (HTML/JS/WASM/assets).
    #
    # index.html must never be cached by the browser: it's tiny, it's
    # what names the current hashed JS/CSS bundle, and after a deploy a
    # returning player who gets a stale cached copy of it would run old
    # client code against the new server -- a real correctness bug, not
    # just an inconvenience (see the 2026-09-09 change log entry). The
    # actual bundle files under /assets/ are named with a content hash
    # by the Vite build, so those are safe to cache hard: a new deploy
    # always produces new filenames, never overwrites an old one, so a
    # long max-age can never serve stale content for those.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Game server: REST/API and the WebSocket upgrade path.
    # Adjust the path prefix once the server's real API surface exists;
    # /socket and /api are placeholders matching the planned protocol.
    location /socket {
        proxy_pass http://bash_fighter_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Idle WebSockets must survive between-round lulls in a match.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api {
        proxy_pass http://bash_fighter_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
