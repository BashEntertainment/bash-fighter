# Bash Fighter reverse proxy config -- TLS variant.
#
# Apply this once a domain is bought and DNS points at this box. It is
# the same routing as deploy/nginx/bash-fighter.conf (static client +
# /socket + /api proxy) plus HTTPS termination and an HTTP->HTTPS
# redirect. See deploy/TLS_SETUP.md for the exact steps to go from
# this file to a live cutover.
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/bash-fighter.conf
#      on the server, replacing the plain-HTTP config.
#   2. Replace every "your.domain" below with the real domain.
#   3. Run certbot (see deploy/TLS_SETUP.md) -- it edits the ssl_*
#      lines in place and reloads nginx for you, so steps 1-2 can be
#      done with certbot's --nginx mode instead of by hand if you
#      prefer starting from the plain-HTTP file.

upstream bash_fighter_app {
    server 127.0.0.1:8081;
    keepalive 32;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name your.domain;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your.domain;

    ssl_certificate     /etc/letsencrypt/live/your.domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    root /srv/bash-fighter/static;
    index index.html;

    # index.html must never be cached -- see bash-fighter.conf for why
    # (it names the current hashed JS/CSS bundle; a stale cached copy
    # would run old client code against a newly deployed server).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /socket {
        proxy_pass http://bash_fighter_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Idle WebSockets must survive between-round lulls in a match.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api {
        proxy_pass http://bash_fighter_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
