name: Bug report
description: Report something that is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/browser (if render/input/net related), Node version (if running the engine locally), commit or branch.
    validations:
      required: false
  - type: checkboxes
    id: determinism
    attributes:
      label: Determinism
      description: Only relevant if this touches packages/sim.
      options:
        - label: This breaks a determinism check (e.g. a failing golden-hash test in npm test)
          required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or a minimal repro if you have one.
    validations:
      required: false
